<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مساهمة الكليات | جرين بحري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/colleges.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <header class="page-head">
      <div class="container">
        <span class="eyebrow">مساهمة الكليات</span>
        <h1>الكليات تزرع الأثر</h1>
        <p>من يزرع أكثر؟ تنافسوا على الصدارة، وكل شجرة تُحسب.</p>
      </div>
    </header>
    <section class="section">
      <div class="container">
        <div class="sum-row">
          <div class="sum"><strong id="sum-colleges">0</strong><span>كليات مشاركة</span></div>
          <div class="sum"><strong id="sum-trees">0</strong><span>شجرة في المجموع</span></div>
          <div class="sum"><strong id="sum-doc">0</strong><span>شجرة موثّقة</span></div>
        </div>
        <div id="podium" class="podium" aria-label="المراكز الثلاثة الأولى"></div>
        <h2 class="board-title">الترتيب الكامل</h2>
        <ol id="board" class="board"></ol>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
