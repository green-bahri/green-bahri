<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>خريطة الأشجار | جرين بحري</title>
  <meta name="description" content="خريطة تفاعلية لأشجار جامعة بحري: مواقعها، حالتها، وإمكانية تبنّيها.">
  <meta name="theme-color" content="#245c45">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

  <!-- أنماط تطبيق الخريطة -->
  <link rel="stylesheet" href="css/map-css/base.css">
  <link rel="stylesheet" href="css/map-css/skeleton_loader.css">
  <link rel="stylesheet" href="css/map-css/components/buttons.css">
  <link rel="stylesheet" href="css/map-css/components/gps-arrow.css">
  <link rel="stylesheet" href="css/map-css/components/search.css">
  <link rel="stylesheet" href="css/map-css/components/share-button.css">
  <link rel="stylesheet" href="css/map-css/components/temp-marker.css">
  <link rel="stylesheet" href="css/map-css/components/bottom-sheet.css">
  <link rel="stylesheet" href="css/map-css/components/zoom-buttons.css">
  
  <!-- أنماط الأشجار والنماذج -->
  <link rel="stylesheet" href="css/map-css/trees/tree-markers.css">
  <link rel="stylesheet" href="css/map-css/trees/status-badges.css">
  <link rel="stylesheet" href="css/map-css/trees/tree-sheet-extras.css">
  <link rel="stylesheet" href="css/map-css/forms/sheet-forms.css">
  <link rel="stylesheet" href="css/map-css/components/tree-sheet.css">

  <!-- أنماط الدمج (يجب أن تكون الأخيرة) -->
  <link rel="stylesheet" href="css/map-css/integration.css">

  <script src="js/main.js" defer></script>
</head>
<body class="map-page on-map-page">
  <div id="site-header"></div>

  <main>
    <section id="map-page" class="page">
      <div id="map" role="application" aria-label="خريطة أشجار جامعة بحري"></div>

      <!-- شاشة التحميل الهيكلية -->
      <div id="skeleton-loader" class="skeleton-loader" role="status" aria-live="polite" aria-label="جارٍ التحميل">
        <div class="loader-content">
          <p class="loader-text">خريطة <em style="font-style:normal;color:#17a243">تشجير</em> الجامعة</p>
          <p style="margin:.4rem 0 0;font-size:.95rem;opacity:.85">لكل غرسة مكان، و<strong>خريطتنا دليلك</strong> للوصول إليها.</p>
          <p style="margin:.6rem 0 0;font-size:.85rem;opacity:.75"><b>مكان أول نفرة:</b> من المكتبة إلى القاعة الوطنية، ومن القاعة الوطنية إلى آخر الجامعة شرقاً</p>
          <div class="loader-ring"></div>
        </div>
      </div>
    </section>
  </main>

  <noscript>
    <div style="position:fixed;inset:0;background:#fff;z-index:99999;display:grid;place-items:center;padding:2rem;text-align:center;font-family:system-ui">
      <p>الخريطة التفاعلية تحتاج تفعيل JavaScript.</p>
    </div>
  </noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="js/map-js/main.js"></script>
</body>
</html>
