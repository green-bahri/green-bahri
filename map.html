<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خريطة الجامعة | جرين بحري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
  <script src="data.js" defer></script>
  <script src="map.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <header class="page-head">
      <div class="container">
        <span class="eyebrow">خريطة الجامعة</span>
        <h1>خريطة تشجير الجامعة</h1>
        <p>مواقع الأشجار في أركان جامعة بحري. اختر منطقة لترى أشجارها.</p>
      </div>
    </header>
    <section class="section">
      <div class="container map-layout">
        <div>
          <div id="area-chips" class="area-chips" role="tablist" aria-label="مناطق الجامعة"></div>
          <figure class="map-fig">
            <svg id="campus-map" viewBox="0 0 640 440" role="img" aria-label="مخطط تقريبي لمناطق التشجير في الجامعة"></svg>
            <figcaption>مخطط تقريبي توضيحي، يُستبدل بخريطة الجامعة الفعلية.</figcaption>
          </figure>
        </div>
        <aside class="map-panel card">
          <h2 id="panel-title">اختر منطقة</h2>
          <p id="panel-sub" class="panel-sub"></p>
          <ul id="panel-list" class="panel-list"></ul>
        </aside>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
