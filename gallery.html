<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معرض المبادرة | جرين بحري</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
  <script src="data.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <header class="page-head">
      <div class="container">
        <span class="eyebrow">معرض المبادرة</span>
        <h1>لحظات من رحلتنا الخضراء</h1>
        <p>صور من فعاليات المبادرة.</p>
      </div>
    </header>
    <section id="compare-sec" class="section" hidden>
      <div class="container">
        <h2 class="ba-title">قبل وبعد</h2>
        <div id="compare"></div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div id="gallery-grid" class="gallery-grid"></div>
      </div>
    </section>
    <dialog id="lightbox" class="lightbox" aria-label="عرض الصورة">
      <button class="lb-close" type="button" aria-label="إغلاق">✕</button>
      <img alt="" id="lb-img">
    </dialog>
  </main>
  <div id="site-footer"></div>
</body>
</html>
